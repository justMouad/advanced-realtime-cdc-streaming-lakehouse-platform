## 1. What this is

A reference implementation of the CDC replication stack used by data-intensive companies (Netflix, Uber, Airbnb, Stripe, LinkedIn) to move row-level changes out of OLTP databases into a queryable lakehouse **in near real time, with exactly-once semantics and full schema evolution**.

Every mutation on the source Postgres — `INSERT`, `UPDATE`, `DELETE` — is captured from the write-ahead log by Debezium, streamed through Kafka, landed immutably in a **Bronze** Iceberg table, deduplicated and conformed into current-state **Silver** tables, and rolled up into business-ready **Gold** marts that power BI dashboards.

> **This is not a toy.** Clean architecture, SOLID, PEP 8, full type hints, config-driven (zero hardcoding), structured logging, Prometheus metrics, Great Expectations contracts, complete CI/CD, Docker Compose for local, and Kubernetes manifests for production.

> 🧠 **New to CDC / lakehouses?** Read [docs/HOW_IT_WORKS.md](docs/HOW_IT_WORKS.md) — the entire system explained from scratch in plain language, answering every *why* and *how*.

